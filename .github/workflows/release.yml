name: Build Tauri App (Cross-platform)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend deps
        run: npm ci

      - name: Setup default configs for release
        run: |
          # Copy default config files if they don't exist
          if [ ! -f src/config.js ]; then
            cp src/config.default.js src/config.js
          fi
          if [ ! -f src-tauri/config.toml ]; then
            cp src-tauri/config.default.toml src-tauri/config.toml
          fi

      - name: Build with tauri
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuantNight ${{ github.ref_name }}
