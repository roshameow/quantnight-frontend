name: Build Tauri App (Cross-platform)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend deps
        run: npm ci

      - name: Generate config file
        env:
          MONGODB_REMOTE_URI: ${{ secrets.MONGODB_REMOTE_URI }}
          PYTHON_WORKING_DIR: ${{ matrix.platform == 'macos-latest' && '/Users/wenliu/Code/python/world_quant_brain' || '/app' }}
          BASH_WORKING_DIR: ${{ matrix.platform == 'macos-latest' && '/Users/wenliu/Code/python/world_quant_brain' || '/app' }}
        run: |
          ./scripts/generate-config.sh
          cat src-tauri/config.toml

      - name: Build with tauri
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuantNight ${{ github.ref_name }}
