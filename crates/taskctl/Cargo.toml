[package]
name = "quantnight-taskctl"
version = "0.1.0"
edition = "2021"
description = "Native thin CLI for the shared QuantNight task core"

[[bin]]
name = "taskctl"
path = "src/main.rs"

[features]
default = []
backend-owner-tests = []
dev-host-tests = []

[dependencies]
quantnight-task-core = { path = "../task-core" }
chrono = "0.4.41"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
syn = { version = "=2.0.100", features = ["full"] }
quote = "1"

[build-dependencies]
sha2 = "0.10"
