[package]
name = "quantnight-task-core"
version = "0.1.0"
edition = "2021"
description = "Shared QuantNight task configuration and process infrastructure"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bson = "2"
chrono = { version = "0.4.41", features = ["serde"] }
config = "0.13"
dirs = "5.0"
futures-util = "0.3"
libc = "0.2"
log = "0.4.27"
mongodb = { version = "2.8", features = ["tokio-runtime"] }
regex = "=1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
sha2 = "0.10"
